<style>
:root {
  --bg: #f6f3ec;
  --surface: #ffffff;
  --ink: #1d2a24;
  --muted: #5f6b65;
  --line: #e2ddd1;
  --accent: #1f5a43;
  --accent-ink: #ffffff;
  --win-bg: #dcefe3; --win-ink: #17603c;
  --loss-bg: #f6dcdc; --loss-ink: #8c2626;
  --ff-bg: #fbe6c8; --ff-ink: #85500c;
  --bye-ink: #a03a3a;
  --owed-bg: #fff6d6; --owed-ink: #7a5a00; --owed-line: #e8cf72;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a211d; --ink: #e9eee9; --muted: #9aa69f; --line: #2b352f;
    --accent: #5fbf8f; --accent-ink: #0d1a13;
    --win-bg: #1d3a2a; --win-ink: #8fe0b2;
    --loss-bg: #3d2223; --loss-ink: #f2a7a7;
    --ff-bg: #3d2e17; --ff-ink: #f3c27a;
    --bye-ink: #e88f8f;
    --owed-bg: #332c12; --owed-ink: #f0d46e; --owed-line: #6b5a1d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a211d; --ink: #e9eee9; --muted: #9aa69f; --line: #2b352f;
  --accent: #5fbf8f; --accent-ink: #0d1a13;
  --win-bg: #1d3a2a; --win-ink: #8fe0b2;
  --loss-bg: #3d2223; --loss-ink: #f2a7a7;
  --ff-bg: #3d2e17; --ff-ink: #f3c27a;
  --bye-ink: #e88f8f;
  --owed-bg: #332c12; --owed-ink: #f0d46e; --owed-line: #6b5a1d;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }
header { margin-bottom: 22px; }
.club { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 4px 0 6px; }
.sub { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.note { display: inline-block; background: var(--owed-bg); color: var(--owed-ink); border: 1px solid var(--owed-line); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
.season-pick { margin-left: auto; }
select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px;
}
section { margin-top: 26px; }
h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 20px; margin: 0 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 10px 8px; text-align: center; white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
tbody tr + tr td { border-top: 1px solid var(--line); }
td.team, th.team { text-align: left; }
td.team { font-weight: 600; }
td.rank { color: var(--muted); width: 2.2em; font-variant-numeric: tabular-nums; }
td.num { font-variant-numeric: tabular-nums; }
td.pct { font-weight: 700; font-variant-numeric: tabular-nums; }
tr.leader td.rank { color: var(--accent); font-weight: 700; }
.streak { font-size: 13px; font-weight: 700; border-radius: 6px; padding: 2px 7px; }
.streak.W { background: var(--win-bg); color: var(--win-ink); }
.streak.L { background: var(--loss-bg); color: var(--loss-ink); }
.owed-pill { font-size: 12px; font-weight: 700; background: var(--owed-bg); color: var(--owed-ink); border: 1px solid var(--owed-line); border-radius: 999px; padding: 1px 8px; }
.dash { color: var(--muted); }
@media (max-width: 560px) {
  .hide-sm { display: none; }
  th, td { padding: 9px 5px; }
  td.team { white-space: normal; min-width: 8em; }
}

.owed-list { list-style: none; margin: 0; padding: 0; }
.owed-list li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; }
.owed-list li + li { border-top: 1px solid var(--line); }
.owed-list .when { color: var(--muted); font-size: 14px; text-align: right; }
.empty { padding: 14px; color: var(--muted); }

.grid th, .grid td { padding: 6px 3px; font-size: 13px; }
.grid th.week { border-left: 1px solid var(--line); }
.grid td.g1 { border-left: 1px solid var(--line); }
.grid td.team, .grid th.team {
  position: sticky; left: 0; background: var(--surface); z-index: 1; padding-left: 12px; padding-right: 10px;
  font-size: 14px; box-shadow: 1px 0 0 var(--line);
}
.r { display: inline-block; min-width: 26px; padding: 3px 0; border-radius: 5px; font-weight: 700; font-size: 12px; }
.r.W { background: var(--win-bg); color: var(--win-ink); }
.r.L { background: var(--loss-bg); color: var(--loss-ink); }
.r.F { background: var(--ff-bg); color: var(--ff-ink); }
.r.BYE { color: var(--bye-ink); font-size: 10px; letter-spacing: .02em; }
.r.owed { background: var(--owed-bg); border: 1px dashed var(--owed-line); color: var(--owed-ink); }
.r.future { color: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* --- buttons that look like team links --- */
.tlink { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 600; }
.tlink:hover, .tlink:focus-visible { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; outline: none; }

/* --- this friday --- */
.friday-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.friday-head strong { font-size: 16px; }
.friday-head span { color: var(--muted); font-size: 14px; }
.matchups { list-style: none; margin: 0; padding: 0; }
.matchups li { display: grid; grid-template-columns: 4.2em 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 14px; }
.matchups li + li { border-top: 1px solid var(--line); }
.matchups .court { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.matchups .a { text-align: right; }
.matchups .vs { color: var(--muted); font-size: 13px; }
.matchups .chips { display: inline-flex; gap: 3px; margin: 0 4px; vertical-align: middle; }
.matchups li.bye { grid-template-columns: 4.2em 1fr; color: var(--muted); }
@media (max-width: 560px) {
  .matchups li { grid-template-columns: 1fr auto 1fr; row-gap: 2px; }
  .matchups .court { grid-column: 1 / -1; }
  .matchups li.bye { grid-template-columns: 1fr; }
}

/* --- rematches & checks --- */
.owed-list .when.overdue { color: var(--loss-ink); font-weight: 600; }
.check-list li { color: var(--ink); }

/* --- week grid (one cell per week) --- */
.grid td.wk { border-left: 1px solid var(--line); padding: 6px 6px 5px; }
.grid .chips { display: flex; gap: 3px; justify-content: center; }
.grid .opp { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; max-width: 7.5em; overflow: hidden; text-overflow: ellipsis; margin-inline: auto; }

/* --- head to head --- */
.h2h th.col { font-size: 11px; text-transform: none; letter-spacing: 0; padding: 8px 4px; white-space: normal; min-width: 4.6em; line-height: 1.2; vertical-align: bottom; }
.h2h td { padding: 7px 4px; font-size: 13px; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); }
.h2h td.team, .h2h th.team { position: sticky; left: 0; background: var(--surface); z-index: 1; padding-left: 12px; padding-right: 10px; font-size: 14px; box-shadow: 1px 0 0 var(--line); border-left: 0; }
.h2h td.self { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); }
.h2h .rec { display: inline-block; min-width: 2.8em; padding: 3px 0; border-radius: 5px; font-weight: 700; font-size: 12px; }
.h2h .rec.won { background: var(--win-bg); color: var(--win-ink); }
.h2h .rec.lost { background: var(--loss-bg); color: var(--loss-ink); }
.h2h .rec.split { background: var(--bg); color: var(--ink); }
.h2h .rec.pending { color: var(--muted); font-weight: 500; }
.h2h .rec.owed { background: var(--owed-bg); color: var(--owed-ink); border: 1px dashed var(--owed-line); }
.hint { color: var(--muted); font-size: 13px; padding: 10px 14px; border-top: 1px solid var(--line); }

/* --- team dialog --- */
dialog.team-dlg { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog.team-dlg::backdrop { background: rgba(0,0,0,.45); }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.dlg-head h3 { font-family: Fraunces, Georgia, serif; font-size: 22px; margin: 0 0 4px; }
.dlg-meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.dlg-close { font: inherit; font-size: 22px; line-height: 1; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.dlg-close:hover { background: var(--bg); color: var(--ink); }
.log td { padding: 9px 8px; font-size: 14px; }
.log td.d { color: var(--muted); text-align: left; padding-left: 16px; }
.log td.o { text-align: left; white-space: normal; }
.log td.c { color: var(--muted); font-size: 12px; }
.log .chips { display: inline-flex; gap: 3px; }
.log tr.future td { color: var(--muted); }

footer { margin-top: 30px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
footer a { color: var(--accent); }
.status { padding: 40px 16px; text-align: center; color: var(--muted); }
.status.err { color: var(--loss-ink); }
</style>

<body>
<div class="wrap">
  <header>
    <div class="club">East Portal Bocce Club</div>
    <h1 id="title">Standings</h1>
    <div class="sub">
      <span id="subtitle"></span>
      <span id="note"></span>
      <label class="season-pick" id="pickWrap" hidden>
        <select id="pick" aria-label="Season"></select>
      </label>
    </div>
  </header>

  <main id="main"><div class="status">Loading standings…</div></main>
  <dialog class="team-dlg" id="teamDlg" aria-labelledby="dlgTitle"></dialog>

  <footer>
    <span>W = Win · L = Loss · F = Forfeit (counts as a loss)</span>
    <span id="updated"></span>
  </footer>
</div>

<script>
// ---- Configuration ---------------------------------------------------------
// The Google Sheet that holds the results. It must be shared as
// "Anyone with the link: Viewer".
const SHEET_ID = "1miUoIW9SfAvgpenrAoiXBBaoT2Tz7JySQedyDTllIT4";
const SEASONS_TAB = "Seasons";
// ----------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function csvUrl(tab) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
}

function parseCSV(text) {
  const rows = []; let row = []; let field = ""; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function fetchTab(tab) {
  const res = await fetch(csvUrl(tab));
  if (!res.ok) throw new Error(`Could not load "${tab}" (HTTP ${res.status})`);
  const text = await res.text();
  if (text.trim().startsWith("<")) throw new Error("The sheet isn't shared publicly yet.");
  return parseCSV(text).map((r) => r.map((v) => v.trim()));
}

const DATE_RE = /^(\d{1,2})\/(\d{1,2})$/;
const MAKEUP_DAYS = 14; // Rules, Section 3: make-ups within two weeks
const tkey = (n) => String(n).toLowerCase().replace(/[^a-z0-9]/g, "");
const DAY = 86400000;

// Optional tabs: "<season> Schedule" (Date|Court|Team|Opponent) and
// "<season> Teams" (Team|Short|Captain). Google returns the first tab when a
// name doesn't exist, so a tab only counts if it has the expected headers.
function tableFrom(rows, required) {
  if (!rows || !rows.length) return null;
  const h = rows[0].map((x) => x.toLowerCase());
  if (!required.every((r) => h.includes(r))) return null;
  return rows.slice(1).map((r) => Object.fromEntries(h.map((k, i) => [k, r[i] || ""])));
}

function buildSeason(rows, year, schedRows, teamRows) {
  const header = rows[0] || [];
  const weeks = []; // { label, date, cols: [i, j] }
  header.forEach((h, i) => {
    const m = h.match(DATE_RE);
    if (!m) return;
    let w = weeks.find((x) => x.label === h);
    if (!w) {
      w = { label: h, date: new Date(year, +m[1] - 1, +m[2]), cols: [] };
      weeks.push(w);
    }
    w.cols.push(i);
  });

  const today = new Date(); today.setHours(0, 0, 0, 0);
  weeks.forEach((w) => { w.past = w.date < today; w.isToday = +w.date === +today; });

  const teams = rows.slice(1)
    .filter((r) => r[0])
    .map((r, order) => {
      const t = { name: r[0], key: tkey(r[0]), order, w: 0, l: 0, f: 0, owed: [], results: [], cells: [] };
      weeks.forEach((wk) => {
        const cells = wk.cols.map((c) => (r[c] || "").toUpperCase());
        t.cells.push(cells);
        let owedHere = 0;
        cells.forEach((v) => {
          if (v === "W") { t.w++; t.results.push("W"); }
          else if (v === "L") { t.l++; t.results.push("L"); }
          else if (v === "F") { t.l++; t.f++; t.results.push("L"); }
          else if (v === "" && wk.past) owedHere++;
        });
        if (owedHere) t.owed.push({ week: wk, n: owedHere });
      });
      const gp = t.w + t.l;
      t.pct = gp ? t.w / gp : 0;
      let s = 0; const last = t.results[t.results.length - 1];
      for (let i = t.results.length - 1; i >= 0 && t.results[i] === last; i--) s++;
      t.streak = last ? `${last}${s}` : "";
      t.owedCount = t.owed.reduce((a, o) => a + o.n, 0);
      return t;
    });
  const byKey = Object.fromEntries(teams.map((t) => [t.key, t]));

  const standings = [...teams].sort((a, b) =>
    b.pct - a.pct || b.w - a.w || a.l - b.l || a.name.localeCompare(b.name));
  const lead = standings[0];
  standings.forEach((t, i) => {
    t.gb = lead ? ((lead.w - t.w) + (t.l - lead.l)) / 2 : 0;
    const prev = standings[i - 1];
    t.rank = prev && prev.pct === t.pct && prev.w === t.w && prev.l === t.l ? prev.rank : i + 1;
  });

  // Team details (short name, captain)
  (teamRows || []).forEach((r) => {
    const t = byKey[tkey(r.team)];
    if (!t) return;
    t.short = r.short || "";
    t.captain = r.captain || "";
  });
  teams.forEach((t) => { if (!t.short) t.short = t.name; });

  // Schedule: per week, who plays whom on which court.
  let hasSchedule = false;
  const unknown = new Set();
  weeks.forEach((w) => { w.games = []; w.bye = []; w.opp = {}; });
  (schedRows || []).forEach((r) => {
    const w = weeks.find((x) => x.label === r.date);
    if (!w) return;
    const a = byKey[tkey(r.team)];
    const isBye = r.opponent.toUpperCase() === "BYE";
    const b = isBye ? null : byKey[tkey(r.opponent)];
    if (!a) { unknown.add(r.team); return; }
    if (!isBye && !b) { unknown.add(r.opponent); return; }
    hasSchedule = true;
    if (isBye) { w.bye.push(a); w.opp[a.key] = { bye: true }; return; }
    const court = r.court;
    w.games.push({ a, b, court });
    w.opp[a.key] = { team: b, court };
    w.opp[b.key] = { team: a, court };
  });

  // Head-to-head and result checks
  const h2h = {}; // h2h[a][b] = { w, l, owed, pending, dates: [] }
  const checks = [];
  const owedPairs = [];
  if (hasSchedule) {
    const cellOf = (t, wi) => t.cells[wi];
    const ok = (x, y) => (x === "W" && (y === "L" || y === "F")) || ((x === "L" || x === "F") && y === "W");
    weeks.forEach((w, wi) => {
      w.games.forEach(({ a, b }) => {
        const ca = cellOf(a, wi), cb = cellOf(b, wi);
        for (const [x, y] of [[a, b], [b, a]]) {
          const cx = x === a ? ca : cb;
          const rec = ((h2h[x.key] ||= {})[y.key] ||= { w: 0, l: 0, owed: 0, pending: 0, dates: [] });
          rec.dates.push(w);
          cx.forEach((v) => {
            if (v === "W") rec.w++;
            else if (v === "L" || v === "F") rec.l++;
            else if (v === "" && w.past) rec.owed++;
            else if (v === "") rec.pending++;
          });
        }
        let owedGames = 0;
        ca.forEach((x, k) => {
          const y = cb[k] || "";
          if (!x && !y) { if (w.past) owedGames++; return; }
          if (x === "BYE" || y === "BYE") {
            checks.push(`${fmtDate(w.date)}: ${a.name} vs ${b.name} is scheduled, but the sheet shows a bye.`);
          } else if (!x || !y) {
            const [has, missing, v] = x ? [a, b, x] : [b, a, y];
            const expect = v === "W" ? "L" : "W";
            checks.push(`${fmtDate(w.date)} game ${k + 1}: ${has.name} has ${v}, but ${missing.name}'s result is blank (expected ${expect}).`);
          } else if (!ok(x, y)) {
            checks.push(`${fmtDate(w.date)} game ${k + 1}: ${a.name} has ${x} and ${b.name} has ${y}.`);
          }
        });
        if (owedGames) {
          const deadline = new Date(w.date.getFullYear(), w.date.getMonth(), w.date.getDate() + MAKEUP_DAYS);
          owedPairs.push({ a, b, week: w, n: owedGames, deadline, overdue: deadline < today });
        }
      });
    });
  }
  if (unknown.size) checks.push(`Schedule lists team name(s) not on the results tab: ${[...unknown].join(", ")}.`);

  // This Friday: the next scheduled week (today counts) with games
  const next = hasSchedule ? weeks.find((w) => !w.past && (w.games.length || w.bye.length)) : null;

  return { weeks, teams, standings, byKey, hasSchedule, h2h, checks, owedPairs, next };
}

const fmtPct = (p) => p.toFixed(3).replace(/^0/, "");
const fmtGB = (g) => (g === 0 ? "—" : (g % 1 ? g.toFixed(1) : String(g)));
const fmtDate = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtLong = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const chip = (v, past) => {
  if (!v) return past ? '<span class="r owed" title="Rematch owed">?</span>' : '<span class="r future">·</span>';
  return `<span class="r ${esc(v)}">${esc(v)}</span>`;
};
const tlink = (t, label) => `<button type="button" class="tlink" data-team="${esc(t.key)}">${esc(label ?? t.name)}</button>`;

let current = null; // the season being shown, for the team dialog

function render(season, s) {
  current = s;
  const { weeks, teams, standings, hasSchedule, h2h, checks, owedPairs, next } = s;
  const anyOwed = standings.some((t) => t.owedCount);

  // ---- This Friday
  let fridayHtml = "";
  if (next) {
    const wi = weeks.indexOf(next);
    const label = next.isToday ? "Tonight" : (next.date - Date.now() < 7 * DAY ? "This Friday" : "Next up");
    const games = [...next.games].sort((x, y) => (+x.court || 99) - (+y.court || 99));
    fridayHtml = `
    <section>
      <h2>${label}</h2>
      <div class="card">
        <div class="friday-head"><strong>${esc(fmtLong(next.date))}</strong><span>${esc(season.time || "")}</span></div>
        <ul class="matchups">
          ${games.map(({ a, b, court }) => {
            const ca = a.cells[wi], cb = b.cells[wi];
            const played = ca.some((v) => v) || cb.some((v) => v);
            return `<li>
              <span class="court">${court ? `Court ${esc(court)}` : ""}</span>
              <span class="a">${tlink(a)}${played ? `<span class="chips">${ca.map((v) => chip(v)).join("")}</span>` : ""}</span>
              <span class="vs">vs</span>
              <span class="b">${played ? `<span class="chips">${cb.map((v) => chip(v)).join("")}</span>` : ""}${tlink(b)}</span>
            </li>`;
          }).join("")}
          ${next.bye.map((t) => `<li class="bye"><span class="court">Bye</span><span>${tlink(t)}</span></li>`).join("")}
        </ul>
      </div>
    </section>`;
  }

  // ---- Standings
  const standingsRows = standings.map((t) => `
    <tr class="${t.rank === 1 ? "leader" : ""}">
      <td class="rank">${t.rank}</td>
      <td class="team">${tlink(t)}</td>
      <td class="num">${t.w}</td>
      <td class="num">${t.l}</td>
      <td class="pct">${fmtPct(t.pct)}</td>
      <td class="num">${fmtGB(t.gb)}</td>
      <td class="hide-sm">${t.streak ? `<span class="streak ${t.streak[0]}">${t.streak}</span>` : '<span class="dash">—</span>'}</td>
      ${anyOwed ? `<td>${t.owedCount ? `<span class="owed-pill">${t.owedCount}</span>` : '<span class="dash">—</span>'}</td>` : ""}
    </tr>`).join("");

  // ---- Rematches owed
  let owedItems;
  if (hasSchedule) {
    owedItems = owedPairs.map((p) => `
      <li><span>${tlink(p.a)} <span class="dash">vs</span> ${tlink(p.b)}</span>
      <span class="when ${p.overdue ? "overdue" : ""}">${fmtDate(p.week.date)}${p.n > 1 ? ` · ${p.n} games` : ""}<br>
      ${p.overdue ? "Make-up window passed " : "Play by "}${fmtDate(p.deadline)}</span></li>`).join("");
  } else {
    owedItems = teams.filter((t) => t.owedCount).map((t) => `
      <li><span>${tlink(t)}</span>
      <span class="when">${t.owed.map((o) => `${fmtDate(o.week.date)}${o.n > 1 ? ` (${o.n} games)` : ""}`).join(", ")}</span></li>`).join("");
  }

  // ---- Week by week
  const gridHead = weeks.map((w) => `<th class="week">${esc(w.label)}</th>`).join("");
  const gridRows = teams.map((t) => `
    <tr><td class="team">${tlink(t)}</td>
    ${t.cells.map((cells, wi) => {
      const w = weeks[wi];
      const o = w.opp && w.opp[t.key];
      if (cells.every((v) => v === "BYE") || (o && o.bye)) {
        return `<td class="wk"><span class="r BYE">BYE</span></td>`;
      }
      const opp = o && o.team ? `<span class="opp" title="vs ${esc(o.team.name)}">vs ${esc(o.team.short)}</span>` : "";
      return `<td class="wk"><span class="chips">${cells.map((v) => chip(v, w.past)).join("")}</span>${opp}</td>`;
    }).join("")}
    </tr>`).join("");

  // ---- Head to head
  let h2hHtml = "";
  if (hasSchedule) {
    const order = standings;
    const head = order.map((t) => `<th class="col" title="${esc(t.name)}">${esc(t.short)}</th>`).join("");
    const body = order.map((a) => `
      <tr><td class="team">${tlink(a)}</td>
      ${order.map((b) => {
        if (a === b) return '<td class="self"></td>';
        const r = h2h[a.key] && h2h[a.key][b.key];
        if (!r) return '<td><span class="dash">—</span></td>';
        const when = r.dates.map((d) => fmtDate(d.date)).join(", ");
        if (!r.w && !r.l) {
          if (r.owed) return `<td title="${esc(when)}: rematch owed"><span class="rec owed">?</span></td>`;
          return `<td title="${esc(when)}"><span class="rec pending">${esc(r.dates.map((d) => d.label).join(", "))}</span></td>`;
        }
        const cls = r.w > r.l ? "won" : r.l > r.w ? "lost" : "split";
        const extra = r.owed ? " + ?" : "";
        return `<td title="${esc(a.name)} vs ${esc(b.name)}, ${esc(when)}"><span class="rec ${cls}">${r.w}-${r.l}${extra}</span></td>`;
      }).join("")}
      </tr>`).join("");
    h2hHtml = `
    <section>
      <h2>Head to head</h2>
      <div class="card">
        <div class="scroll">
          <table class="h2h">
            <thead><tr><th class="team">Team</th>${head}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
        <div class="hint">Read across: each row is that team's record against the team in the column. Dates show matches not played yet.</div>
      </div>
    </section>`;
  }

  const checksHtml = checks.length ? `
    <section>
      <h2>Results to check</h2>
      <div class="card"><ul class="owed-list check-list">${checks.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>
    </section>` : "";

  $("main").innerHTML = `
    ${fridayHtml}
    <section>
      <h2>Standings</h2>
      <div class="card scroll">
        <table>
          <thead><tr>
            <th>#</th><th class="team">Team</th><th>W</th><th>L</th><th>Pct</th><th>GB</th>
            <th class="hide-sm">Streak</th>${anyOwed ? "<th>Owed</th>" : ""}
          </tr></thead>
          <tbody>${standingsRows}</tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Rematches owed</h2>
      <div class="card">
        ${owedItems ? `<ul class="owed-list">${owedItems}</ul>` : '<div class="empty">None. Every game played so far is recorded.</div>'}
      </div>
    </section>

    ${h2hHtml}

    <section>
      <h2>Week by week</h2>
      <div class="card">
        <div class="scroll">
          <table class="grid">
            <thead><tr><th class="team">Team</th>${gridHead}</tr></thead>
            <tbody>${gridRows}</tbody>
          </table>
        </div>
        <div class="legend">
          <span><span class="r W">W</span> Win</span>
          <span><span class="r L">L</span> Loss</span>
          <span><span class="r F">F</span> Forfeit</span>
          <span><span class="r BYE">BYE</span> Bye</span>
          <span><span class="r owed">?</span> Rematch owed</span>
        </div>
      </div>
    </section>
    ${checksHtml}`;
  // On narrow screens, start the grid scrolled to the most recent weeks.
  const grid = document.querySelector(".grid");
  if (grid) grid.parentElement.scrollLeft = grid.parentElement.scrollWidth;
}

function openTeam(key) {
  const s = current; if (!s) return;
  const t = s.byKey[key]; if (!t) return;
  const rows = s.weeks.map((w, wi) => {
    const o = w.opp && w.opp[t.key];
    const cells = t.cells[wi];
    if ((o && o.bye) || cells.every((v) => v === "BYE")) {
      return `<tr class="${w.past ? "" : "future"}"><td class="d">${esc(fmtDate(w.date))}</td><td class="o">Bye</td><td class="c"></td><td></td></tr>`;
    }
    const opp = o && o.team ? tlink(o.team) : '<span class="dash">—</span>';
    const anyResult = cells.some((v) => v);
    return `<tr class="${w.past || anyResult ? "" : "future"}">
      <td class="d">${esc(fmtDate(w.date))}</td>
      <td class="o">${o && o.team ? "vs " : ""}${opp}</td>
      <td class="c">${o && o.court ? `Court ${esc(o.court)}` : ""}</td>
      <td><span class="chips">${cells.map((v) => chip(v, w.past)).join("")}</span></td>
    </tr>`;
  }).join("");
  const dlg = $("teamDlg");
  dlg.innerHTML = `
    <div class="dlg-head">
      <div>
        <h3 id="dlgTitle">${esc(t.name)}</h3>
        <div class="dlg-meta">
          <span>${t.w}-${t.l} · ${ordinal(t.rank)} place</span>
          ${t.captain ? `<span>Captain: ${esc(t.captain)}</span>` : ""}
        </div>
      </div>
      <button type="button" class="dlg-close" aria-label="Close">×</button>
    </div>
    <table class="log"><tbody>${rows}</tbody></table>`;
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}

function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest(".tlink");
  if (btn) { openTeam(btn.dataset.team); return; }
  const dlg = $("teamDlg");
  if (e.target.closest(".dlg-close") || e.target === dlg) dlg.close();
});

let seasons = [];

async function loadSeason(tab) {
  const season = seasons.find((s) => s.tab === tab) || seasons[0];
  $("title").textContent = season.title || season.tab;
  $("subtitle").textContent = "";
  $("note").innerHTML = season.note ? `<span class="note">${esc(season.note)}</span>` : "";
  document.title = `${season.title || season.tab} · East Portal Bocce`;
  $("main").innerHTML = '<div class="status">Loading standings…</div>';
  try {
    const optional = (tab) => fetchTab(tab).catch(() => null);
    const [rows, sched, teamInfo] = await Promise.all([
      fetchTab(season.tab), optional(`${season.tab} Schedule`), optional(`${season.tab} Teams`),
    ]);
    render(season, buildSeason(rows, season.year || new Date().getFullYear(),
      tableFrom(sched, ["date", "team", "opponent"]), tableFrom(teamInfo, ["team", "short"])));
    $("updated").textContent = `Loaded ${new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}`;
  } catch (e) {
    $("main").innerHTML = `<div class="status err">${esc(e.message)}</div>`;
  }
}

async function init() {
  try {
    const rows = await fetchTab(SEASONS_TAB);
    const h = rows[0].map((x) => x.toLowerCase());
    const col = (name) => h.indexOf(name);
    seasons = rows.slice(1).filter((r) => r[col("tab")]).map((r) => ({
      tab: r[col("tab")],
      title: r[col("season")] || r[col("tab")],
      year: parseInt(r[col("year")], 10) || new Date().getFullYear(),
      note: col("note") >= 0 ? r[col("note")] : "",
    }));
    if (!seasons.length) throw new Error("No seasons listed on the Seasons tab.");
  } catch (e) {
    $("main").innerHTML = `<div class="status err">${esc(e.message)}</div>`;
    return;
  }

  const pick = $("pick");
  pick.innerHTML = seasons.map((s) => `<option value="${esc(s.tab)}">${esc(s.tab)}</option>`).join("");
  $("pickWrap").hidden = seasons.length < 2;
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const initial = seasons.some((s) => s.tab === fromHash) ? fromHash : seasons[0].tab;
  pick.value = initial;
  pick.addEventListener("change", () => { location.hash = encodeURIComponent(pick.value); });
  window.addEventListener("hashchange", () => {
    const t = decodeURIComponent(location.hash.slice(1));
    if (seasons.some((s) => s.tab === t)) { pick.value = t; loadSeason(t); }
  });
  loadSeason(initial);
}

init();
</script>
</body>
</html>
